# Bước 1 (thử nghiệm) — dựng libtailscale.aar để sau này nhúng VPN vào OnCam.
#
# Workflow NÀY TÁCH RIÊNG workflow build chính (oncam-android.yml): nó chỉ chạy khi
# đụng vào chính file này, nên build app đang xanh không bị ảnh hưởng. Mục tiêu duy nhất:
# xác nhận CI có dựng được AAR Tailscale (gomobile + NDK) hay không, rồi upload làm artifact.
#
# AAR dựng từ repo tailscale/tailscale-android (giấy phép BSD-3-Clause), ghim tag cố định.
# Tham chiếu: Makefile target `libtailscale` chạy gomobile bind -target android -androidapi 26
# trên gói ./libtailscale, cần Go (pinned qua ./tool/go) + Android NDK.
name: OnCam build libtailscale.aar (thử nghiệm bước 1)

on:
  push:
    paths:
      - ".github/workflows/oncam-tailscale-aar.yml"
      - "on-demand-camera/vpn/**"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # Ghim phiên bản tailscale-android (BSD-3-Clause). Đổi tại đây khi nâng cấp.
  TS_ANDROID_REF: "1.104.5-t788384763-gd8673104f"
  # NDK mà Makefile của tailscale-android dùng (linker flags đặc thù NDK 23).
  NDK_VERSION: "23.1.7779620"

jobs:
  build-aar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cài Go (để gomobile chạy; tailscale tự tải toolchain đúng qua GOTOOLCHAIN)
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Lấy mã nguồn tailscale-android (ghim tag)
        uses: actions/checkout@v4
        with:
          repository: tailscale/tailscale-android
          ref: ${{ env.TS_ANDROID_REF }}
          path: tailscale-android
          fetch-depth: 1

      - name: Lấy mã nguồn OnCam (repo này, để biên dịch module :vpn)
        uses: actions/checkout@v4
        with:
          path: oncam
          fetch-depth: 1

      - name: Cài đúng Android NDK ${{ env.NDK_VERSION }}
        run: |
          set -eux
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --install "ndk;${NDK_VERSION}" >/dev/null
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          # Makefile chọn "ndk cao nhất" dưới ANDROID_HOME → gỡ các NDK khác để nó chọn đúng 23.
          for d in "${ANDROID_HOME}/ndk/"*; do
            case "$d" in */${NDK_VERSION}) : ;; *) rm -rf "$d" ;; esac
          done
          ls -1 "${ANDROID_HOME}/ndk"

      - name: Dựng libtailscale.aar (make libtailscale)
        working-directory: tailscale-android
        env:
          GOTOOLCHAIN: auto
        run: |
          set -eux
          make libtailscale
          ls -lh android/libs/libtailscale.aar

      - name: Trích API Java của AAR (để viết glue cho đúng chữ ký)
        working-directory: tailscale-android
        run: |
          set -eux
          cd android/libs
          mkdir -p aar_x && (cd aar_x && unzip -o ../libtailscale.aar >/dev/null)
          ls -R aar_x | head -40
          mkdir -p cj && (cd cj && unzip -o ../aar_x/classes.jar >/dev/null)
          # Liệt kê mọi lớp + chữ ký public (API mà Kotlin sẽ gọi).
          : > ../../../libtailscale-api.txt
          find cj -name '*.class' | sed 's#cj/##;s#/#.#g;s#\.class$##' | sort > ../../../libtailscale-classes.txt
          while read -r cls; do
            echo "==== $cls ====" >> ../../../libtailscale-api.txt
            javap -classpath cj -public "$cls" >> ../../../libtailscale-api.txt 2>/dev/null || true
          done < ../../../libtailscale-classes.txt
          echo "=== Tổng số lớp ==="; wc -l ../../../libtailscale-classes.txt
          echo "=== Các lớp libtailscale ==="; grep -i 'libtailscale\|tailscale' ../../../libtailscale-classes.txt | head -60 || true

      - name: Biên dịch module :vpn đối chiếu libtailscale (bằng chứng glue khớp API)
        run: |
          set -eux
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" >/dev/null
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          # classes.jar (API Tailscale) rút từ AAR → libs của module :vpn, dùng compileOnly.
          mkdir -p oncam/on-demand-camera/vpn/libs
          cp tailscale-android/android/libs/aar_x/classes.jar oncam/on-demand-camera/vpn/libs/libtailscale.jar
          cd oncam/on-demand-camera
          chmod +x gradlew
          ./gradlew -p vpn :assembleRelease --no-daemon --stacktrace

      - name: Upload libtailscale.aar + API
        uses: actions/upload-artifact@v4
        with:
          name: libtailscale-aar
          path: |
            tailscale-android/android/libs/libtailscale.aar
            libtailscale-api.txt
            libtailscale-classes.txt
          if-no-files-found: error
          retention-days: 14
