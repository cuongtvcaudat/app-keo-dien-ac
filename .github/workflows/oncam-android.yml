# Build Android cho dự án on-demand-camera (OnCam).
# - Chạy khi có thay đổi trong on-demand-camera/ hoặc chính file này.
# - Job "build": build cả 3 module bằng `./gradlew build` (biên dịch, unit test, lint),
#   xuất 2 file APK debug làm artifact để tải về cài thử lên điện thoại.
# - Job "emulator": chạy test của camera-node trên emulator Android 13 (API 33, gần Oppo Reno 5)
#   để kiểm chứng broker MQTT nhúng chạy được trên Android thật.
name: OnCam Android build

on:
  push:
    branches:
      - main
      - "claude/android-security-camera-*"
    paths:
      - "on-demand-camera/**"
      - ".github/workflows/oncam-android.yml"
  pull_request:
    paths:
      - "on-demand-camera/**"
      - ".github/workflows/oncam-android.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: oncam-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: on-demand-camera
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v5

      - name: Cài JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cài Gradle (cache + kiểm tra wrapper)
        uses: gradle/actions/setup-gradle@v5

      - name: Build + unit test + lint
        run: ./gradlew build --stacktrace --console=plain

      - name: Tải lên APK debug
        uses: actions/upload-artifact@v5
        with:
          name: oncam-debug-apk
          path: |
            on-demand-camera/camera-node/build/outputs/apk/debug/*.apk
            on-demand-camera/viewer/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Tải lên báo cáo (lint/test) khi lỗi
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: oncam-reports
          path: |
            on-demand-camera/**/build/reports/
            on-demand-camera/**/build/test-results/
          retention-days: 7

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: on-demand-camera
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v5

      - name: Cài JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cài Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Bật KVM cho emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test trên emulator Android 13 (API 33)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: on-demand-camera
          script: ./gradlew :camera-node:connectedDebugAndroidTest --stacktrace --console=plain

      - name: Tải lên kết quả test emulator
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: oncam-emulator-test-results
          path: |
            on-demand-camera/camera-node/build/reports/androidTests/
            on-demand-camera/camera-node/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7
